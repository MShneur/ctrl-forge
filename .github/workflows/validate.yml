name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile tools
        run: python -m compileall tools
      - name: Privacy scan
        run: python tools/privacy_scan.py .
      - name: Validate forge
        run: python tools/validate_forge.py
